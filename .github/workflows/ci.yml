name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # The submodules under third_party/ are only needed for the benchmarks,
      # and one of them vendors a very large Eigen history — so don't fetch them.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show resolved environment
        run: python -c "import jax, numpy, optax; print('jax', jax.__version__, '| devices', jax.devices())"

      - name: Run tests
        # The reference-parity tests importorskip torch/smplx and additionally
        # skip when data/ is absent, so this runs the synthetic suite — no model
        # weights, no GPU, no secrets required.
        run: pytest

  package:
    name: build + import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Catches metadata errors and any extra that fails to resolve, which a
      # plain editable install would not surface.
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel and import it
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import smpl_jax; print(smpl_jax.__all__)"
